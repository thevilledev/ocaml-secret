<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 638 188" width="638" height="188" role="img" aria-labelledby="secret-banner-title">
  <title id="secret-banner-title">A Secret.t handle inside the OCaml heap owns a payload outside it: guard pages around an OCaml string header and the key bytes. Destroy, exit and collection all zeroize the key bytes.</title>
  <style>
    svg { color: #1f2328; }
  </style>
  <rect x="-14" y="-14" width="638" height="188" rx="6" fill="#ffffff"/>
  <defs>
    <marker id="secret-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" fill="currentColor">
    <text x="0" y="11" font-size="12">OCaml heap</text>
    <text x="250" y="11" font-size="12">outside the OCaml heap</text>
    <line x1="239" y1="0" x2="239" y2="140" stroke="currentColor" stroke-dasharray="2 4" opacity="0.45"/>

    <rect x="0.5" y="33.5" width="110" height="34" fill="none" stroke="currentColor"/>
    <text x="55.5" y="55" font-size="14" text-anchor="middle">Secret.t</text>

    <text x="178" y="44" font-size="12" text-anchor="middle">owns</text>
    <line x1="112" y1="50.5" x2="246" y2="50.5" stroke="currentColor" marker-end="url(#secret-arrow)"/>

    <rect x="250.5" y="33.5" width="50" height="34" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-dasharray="3 2"/>
    <rect x="300.5" y="33.5" width="44" height="34" fill="none" stroke="currentColor"/>
    <rect x="344.5" y="33.5" width="200" height="34" fill="none" stroke="currentColor"/>
    <rect x="544.5" y="33.5" width="50" height="34" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-dasharray="3 2"/>

    <text x="275.5" y="55" font-size="11" text-anchor="middle">guard</text>
    <text x="322.5" y="55" font-size="11" text-anchor="middle">hdr</text>
    <text x="444.5" y="55" font-size="14" text-anchor="middle">key bytes</text>
    <text x="569.5" y="55" font-size="11" text-anchor="middle">guard</text>

    <path d="M 322.5 68 L 322.5 80" fill="none" stroke="currentColor" opacity="0.5"/>
    <text x="322.5" y="92" font-size="10" text-anchor="middle" opacity="0.7">OCaml string header</text>

    <text x="0" y="132" font-size="12">destroy / exit / GC</text>
    <text x="300" y="120" font-size="12" text-anchor="middle">zeroize</text>
    <path d="M 145 128 L 444.5 128 L 444.5 72" fill="none" stroke="currentColor" marker-end="url(#secret-arrow)"/>

    <text x="594.5" y="152" font-size="10" text-anchor="end" opacity="0.7">dashed: hardened tier only</text>
  </g>
</svg>
