name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / OCaml ${{ matrix.ocaml }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ocaml: "4.14"
            dependencies: --with-test
            targets: "@install @runtest"
            benchmarks: false
          - os: ubuntu-latest
            ocaml: "5.4"
            dependencies: --with-test --with-doc
            targets: "@install @runtest @doc"
            benchmarks: true
          - os: macos-latest
            ocaml: "5.4"
            dependencies: --with-test
            targets: "@install @runtest"
            benchmarks: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      - run: opam install . --deps-only ${{ matrix.dependencies }}
      - run: opam exec -- dune build ${{ matrix.targets }}
      - if: matrix.benchmarks
        name: Check constant-time equality
        run: opam exec -- dune exec bench/ct_equal.exe -- 2000 50
      - if: matrix.benchmarks
        name: Check allocation behavior
        run: opam exec -- dune exec bench/alloc_bench.exe
