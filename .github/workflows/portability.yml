name: Portability

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/portability.yml"
      - "config/**"
      - "src/**"
      - "test/**"
      - "unix/**"
      - "dune-project"
      - "secret.opam"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  musl:
    name: alpine (musl) / OCaml 5.4
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ocaml/opam images run as the unprivileged `opam` user, which cannot
      # write the runner's state files when used as a job container; run the
      # image explicitly instead. Alpine 3.24's musl 1.2.6 cannot allocate
      # OCaml's signal stack on some AMX-capable hosted CPUs, so keep this on
      # the last musl 1.2.5 image until that runtime combination is fixed.
      - run: |
          docker run --rm -v "$PWD:/src" \
            ocaml/opam:alpine-3.23-ocaml-5.4@sha256:bf6b06d9c1634a8f9f4ed95f991887bb6d4942d1714a9c9797d1cf8fc3e8e5b7 sh -ec '
            sudo cp -r /src /work && sudo chown -R opam /work && cd /work
            export OPAMJOBS=2
            opam install . --deps-only --with-test -y
            opam exec -- dune build @install @runtest'

  linux32:
    name: alpine i386 / OCaml 4.14 (32-bit)
    # Stays on a GitHub-hosted runner. The Avrea runner kernel cannot exec
    # 32-bit binaries, so `--platform linux/386` pulls and then dies with
    # "exec format error"; qemu would emulate away the faulting behaviour
    # this job exists to check.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The other jobs are all 64-bit, but the C stubs size several things off
      # `value`: the block-size arithmetic, the reuse pool's size classes (a
      # slot index that aliases two classes hands a short block to a longer
      # secret), and the empty-string sentinel. linux/386 runs natively on the
      # x86_64 runner, and Alpine ships a native 4.14 ocamlopt for it.
      - run: |
          docker run --rm --platform linux/386 -v "$PWD:/src:ro" alpine:3.20 sh -ec '
            apk add --no-cache ocaml ocaml-compiler-libs dune ocaml-findlib \
              gcc musl-dev make patch tar curl rsync git bash opam
            cp -r /src /work && cd /work && rm -rf _build
            test "$(ocaml -e "print_int Sys.word_size")" = 32
            export OPAMJOBS=2 OPAMYES=1 OPAMROOT=/opamroot
            opam init --disable-sandboxing --bare
            opam switch create sys --packages=ocaml-system
            eval $(opam env --switch=sys)
            opam install dune-configurator alcotest
            dune build @install @runtest'

  windows:
    name: windows-mingw / OCaml 5.4 (best effort)
    runs-on: avrea-windows-2025-4-vcpu
    if: github.event_name != 'pull_request'
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        # PowerShell would treat `@install` as its splatting operator.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "5.4"
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @install @runtest

  solo5-cross:
    name: solo5 cross-build (best effort)
    runs-on: avrea-ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3.7.2
        with:
          ocaml-compiler: "5.4"
      - run: opam install ocaml-solo5 dune-configurator
      - run: opam exec -- dune build -x solo5 @install
